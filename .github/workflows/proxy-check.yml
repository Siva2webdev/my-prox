name: Proxy Checker

on: workflow_dispatch  # lets you run manually from GitHub Actions tab

jobs:
  run-proxy-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'   # or 3.11 if you prefer

      - name: Install dependencies
        run: pip install requests

      - name: Run proxy checker
        run: python your_script_name.py

      - name: Commit alive_proxies.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alive_proxies.txt
          git commit -m "Update alive proxies [skip ci]" || echo "No changes to commit"
          git push
