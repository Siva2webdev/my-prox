name: Proxy Checker

on:
  workflow_dispatch:   # run manually when you want

jobs:
  run-proxy-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 gives push access to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run proxy checker
        run: python your_script_name.py

      - name: Commit alive_proxies.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alive_proxies.txt
          git commit -m "Update alive proxies [skip ci]" || echo "No changes to commit"
          git push
